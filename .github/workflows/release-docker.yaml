name: Release Docker
on:
  push:
    branches:
      - main
    tags: ["*"]
  # scheduled-release.yaml calls this for the tags it creates.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  # The release tag, or empty for snapshots from main.
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  publish:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/scip-code/scip-java"
          if [[ -n "${TAG}" ]]; then
            version="${TAG#v}"
            tag="${image}:${version}-${{ matrix.arch }}"
          else
            tag="${image}:latest-snapshot-${{ matrix.arch }}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/scip-code/scip-java
            org.opencontainers.image.revision=${{ steps.tag.outputs.revision }}

  publish-manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/scip-code/scip-java"
          if [[ -n "${TAG}" ]]; then
            version="${TAG#v}"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:${version}" \
              "${image}:${version}-amd64" \
              "${image}:${version}-arm64"
          else
            docker buildx imagetools create \
              --tag "${image}:latest-snapshot" \
              "${image}:latest-snapshot-amd64" \
              "${image}:latest-snapshot-arm64"
          fi
