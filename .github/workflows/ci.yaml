name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    name: Formatting
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - run: gradle spotlessCheck --no-daemon

  kotlin_indexer:
    runs-on: ubuntu-latest
    name: scip-kotlin-analysis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: scip-kotlin-analysis tests
        run: gradle :scip-kotlin-analysis:test --no-daemon

  docker_test:
    runs-on: ubuntu-latest
    name: Docker CLI tests
    steps:
      - uses: actions/checkout@v7

      - name: Build Dockerised CLI
        run: docker build -t ghcr.io/scip-code/scip-java:latest .

      - name: Test Maven and Gradle fixtures
        shell: bash
        run: |
          set -euo pipefail
          for fixture in maven/basic gradle/kotlin2; do
            repo_dir="$(mktemp -d "$RUNNER_TEMP/scip-java-docker.XXXXXX")"
            cp -R "scip-java/src/test/resources/fixtures/$fixture/." "$repo_dir/"

            echo "Indexing $fixture"
            # Match the Kotlin fixture's JDK 17 toolchain without relying on fallback.
            docker run --rm --env JVM_VERSION=17 \
              --mount "type=bind,source=$repo_dir,target=/sources" \
              -w /sources ghcr.io/scip-code/scip-java:latest scip-java index
            test -s "$repo_dir/index.scip"
          done

  ci-pass:
    if: always()
    needs: [format, kotlin_indexer, docker_test]
    runs-on: ubuntu-latest
    name: CI pass
    steps:
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
